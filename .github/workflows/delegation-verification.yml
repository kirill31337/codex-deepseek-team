name: Delegation verification
on:
  push:
    branches: [deepseek/delegation-profiles]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-surface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @openai/codex @anthropic-ai/claude-code
      - run: |
          codex --version
          codex exec --help
          claude --version
          claude --help
